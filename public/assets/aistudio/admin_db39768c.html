<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#050505;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.glass{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:1rem}
.btn{background:linear-gradient(135deg,#fde047,#eab308);color:#111;font-weight:700;border-radius:999px;padding:.55rem 1.1rem;font-size:.85rem}
.btn:disabled{opacity:.5}.sm{padding:.3rem .8rem;font-size:.75rem}
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:.7rem;padding:.65rem .9rem;color:#fff;outline:none}.inp:focus{border-color:#eab308}.inp option{background:#111}
.tab{padding:.45rem 1rem;border-radius:999px;border:1px solid rgba(255,255,255,.15);font-size:.85rem}.tab.on{background:#eab308;color:#111;font-weight:700;border-color:#eab308}
.pane{display:none}.pane.on{display:block}
</style>
</head>
<body>
<div id="login" class="max-w-sm mx-auto mt-24 px-4"><div class="glass p-7 space-y-3">
 <h1 class="text-xl font-extrabold">Admin Login</h1>
 <input id="e" type="email" class="inp" placeholder="Email" autocomplete="username">
 <input id="p" type="password" class="inp" placeholder="Password" autocomplete="current-password">
 <button class="btn w-full" onclick="login()">Login</button><p id="le" class="text-sm text-red-400"></p>
</div></div>

<div id="app" class="hidden max-w-6xl mx-auto px-4 py-6">
 <div class="flex items-center justify-between mb-5"><h1 class="text-xl font-extrabold">Admin Panel</h1><button class="tab" onclick="logout()">Logout</button></div>
 <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5 text-center">
  <div class="glass p-4"><p class="text-xs text-neutral-400">Users</p><p id="sU" class="text-2xl font-bold"></p></div>
  <div class="glass p-4"><p class="text-xs text-neutral-400">Total user balances</p><p id="sB" class="text-2xl font-bold"></p></div>
  <div class="glass p-4"><p class="text-xs text-neutral-400">Pending requests</p><p id="sP" class="text-2xl font-bold text-yellow-500"></p></div>
  <div class="glass p-4"><p class="text-xs text-neutral-400">Pending amount</p><p id="sA" class="text-2xl font-bold text-yellow-500"></p></div>
 </div>
 <div class="flex gap-2 mb-4"><button class="tab on" data-t="w" onclick="tab('w')">Withdrawals</button><button class="tab" data-t="u" onclick="tab('u')">Users</button><button class="tab" data-t="a" onclick="tab('a')">Ad Slots</button></div>

 <div id="w" class="pane on">
  <div class="flex gap-2 mb-3 text-sm"><button class="tab on" id="fP" onclick="filt('pending')">Pending</button><button class="tab" id="fA" onclick="filt('all')">All</button></div>
  <div class="glass overflow-x-auto"><table class="w-full text-sm min-w-[780px]"><thead class="text-neutral-400 text-left"><tr><th class="p-3">Date</th><th class="p-3">User</th><th class="p-3">Method</th><th class="p-3">Account title</th><th class="p-3">Account no.</th><th class="p-3">Amount</th><th class="p-3">Status</th><th class="p-3"></th></tr></thead><tbody id="wB"></tbody></table></div>
 </div>

 <div id="u" class="pane"><input id="q" oninput="drawU()" class="inp mb-3" placeholder="Search by name or user ID…">
  <div class="glass overflow-x-auto"><table class="w-full text-sm min-w-[640px]"><thead class="text-neutral-400 text-left"><tr><th class="p-3">Name</th><th class="p-3">User ID</th><th class="p-3">Balance</th><th class="p-3">Ads watched</th><th class="p-3">Referred by</th><th class="p-3">Joined</th></tr></thead><tbody id="uB"></tbody></table></div></div>

 <div id="a" class="pane">
  <div class="glass p-5 mb-4 space-y-3"><p class="font-semibold">Add ad slot</p>
   <div class="grid md:grid-cols-3 gap-3"><input id="aT" class="inp" placeholder="Title (e.g. Sponsored Ad #4)"><select id="aK" class="inp"><option value="html">HTML / script code</option><option value="url">Page URL</option></select></div>
   <textarea id="aC" rows="4" class="inp font-mono text-xs" placeholder="Paste your ad network code or URL here"></textarea>
   <button class="btn" onclick="addSlot()">Add Slot</button></div>
  <div class="glass overflow-x-auto"><table class="w-full text-sm min-w-[600px]"><thead class="text-neutral-400 text-left"><tr><th class="p-3">Title</th><th class="p-3">Type</th><th class="p-3">Content</th><th class="p-3">Status</th><th class="p-3"></th></tr></thead><tbody id="aB"></tbody></table></div>
 </div>
</div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-6 glass px-5 py-3 text-sm hidden bg-black z-50"></div>

<script>
/* ✏️ PASTE YOUR SUPABASE VALUES (anon key only). Only a user marked is_admin can use this page. */
const CFG={url:'YOUR_SUPABASE_URL',key:'YOUR_SUPABASE_ANON_KEY'};
if(CFG.url.startsWith('YOUR_')){document.body.innerHTML='<div style="max-width:480px;margin:80px auto;padding:24px;font-family:system-ui;color:#fff"><h2 style="color:#eab308;font-size:22px;font-weight:800">Setup needed</h2><p style="margin-top:10px;color:#a3a3a3">Paste your Supabase Project URL and anon key into CFG at the top of this script. See SETUP.md.</p></div>';throw new Error('Supabase keys missing')}
const sb=supabase.createClient(CFG.url,CFG.key);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs. '+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=s=>new Date(s).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
let U=[],W=[],S=[],F='pending';
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2800)};
async function login(){$('le').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});if(error)return $('le').textContent='Invalid login.';init()}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){
 const{data:{user}}=await sb.auth.getUser();if(!user)return;
 const{data:me}=await sb.from('profiles').select('is_admin').eq('id',user.id).single();
 if(!me||!me.is_admin){await sb.auth.signOut();$('le').textContent='Access denied.';return}
 $('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
async function load(){
 const[u,w,s]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('withdrawals').select('*').order('created_at',{ascending:false}),sb.from('ad_slots').select('*').order('title')]);
 U=u.data||[];W=w.data||[];S=s.data||[];
 const pend=W.filter(x=>x.status==='pending');
 $('sU').textContent=U.length;$('sB').textContent=rs(U.reduce((a,x)=>a+Number(x.balance),0));$('sP').textContent=pend.length;$('sA').textContent=rs(pend.reduce((a,x)=>a+Number(x.amount),0));
 drawW();drawU();drawA()}
function tab(t){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===t));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function filt(f){F=f;$('fP').classList.toggle('on',f==='pending');$('fA').classList.toggle('on',f==='all');drawW()}
const who=id=>U.find(x=>x.id===id);
function drawW(){
 const rows=W.filter(x=>F==='all'||x.status==='pending');
 $('wB').innerHTML=rows.map(w=>{const u=who(w.user_id)||{};return `<tr class="border-t border-white/5"><td class="p-3 whitespace-nowrap">${dt(w.created_at)}</td><td class="p-3">${esc(u.name)}<br><span class="text-xs text-neutral-500">${esc(u.user_code)}</span></td><td class="p-3">${esc(w.method)}</td><td class="p-3">${esc(w.account_title)}</td><td class="p-3 font-mono">${esc(w.account_number)}</td><td class="p-3 font-bold text-yellow-500">${rs(w.amount)}</td><td class="p-3 capitalize ${w.status==='approved'?'text-green-400':w.status==='rejected'?'text-red-400':'text-yellow-500'}">${w.status}</td><td class="p-3 whitespace-nowrap">${w.status==='pending'?`<button class="btn sm" onclick="review('${w.id}',true)">Approve</button> <button class="tab sm" onclick="review('${w.id}',false)">Reject</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8" class="p-4 text-neutral-500">Nothing here.</td></tr>'}
async function review(id,ok){
 if(!confirm(ok?'Approve? Do this only AFTER you have sent the money.':'Reject and refund the balance to the user?'))return;
 const{error}=await sb.rpc('admin_review',{p_id:id,p_approve:ok});if(error)return toast(error.message);toast(ok?'Approved ✓':'Rejected and refunded ✓');load()}
function drawU(){const q=$('q').value.toLowerCase();
 $('uB').innerHTML=U.filter(x=>!q||x.name.toLowerCase().includes(q)||x.user_code.toLowerCase().includes(q)).map(x=>`<tr class="border-t border-white/5"><td class="p-3">${esc(x.name)}${x.is_admin?' <span class="text-xs text-yellow-500">admin</span>':''}</td><td class="p-3">${esc(x.user_code)}</td><td class="p-3">${rs(x.balance)}</td><td class="p-3">${x.ads_total}</td><td class="p-3">${esc((who(x.referrer)||{}).user_code||'-')}</td><td class="p-3">${dt(x.created_at)}</td></tr>`).join('')}
function drawA(){
 $('aB').innerHTML=S.map(s=>`<tr class="border-t border-white/5"><td class="p-3">${esc(s.title)}</td><td class="p-3">${s.kind}</td><td class="p-3 max-w-xs truncate font-mono text-xs text-neutral-400">${esc(s.content)}</td><td class="p-3 ${s.active?'text-green-400':'text-neutral-500'}">${s.active?'Active':'Off'}</td><td class="p-3 whitespace-nowrap"><button class="tab sm" onclick="toggle('${s.id}',${!s.active})">${s.active?'Turn off':'Turn on'}</button> <button class="tab sm text-red-400" onclick="delSlot('${s.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="p-4 text-neutral-500">No slots yet.</td></tr>'}
async function addSlot(){const title=$('aT').value.trim(),content=$('aC').value.trim();if(!title||!content)return toast('Enter a title and the ad code/URL.');
 const{error}=await sb.from('ad_slots').insert({title,kind:$('aK').value,content});if(error)return toast(error.message);$('aT').value=$('aC').value='';toast('Slot added ✓');load()}
async function toggle(id,v){const{error}=await sb.from('ad_slots').update({active:v}).eq('id',id);if(error)return toast(error.message);load()}
async function delSlot(id){if(!confirm('Delete this slot?'))return;const{error}=await sb.from('ad_slots').delete().eq('id',id);if(error)return toast(error.message);load()}
sb.auth.getSession().then(({data})=>{if(data.session)init()});
</script>
</body>
</html>
